        <style>html, body {

        body {
            display: flex;

        #fourohfour {
            background: linear-gradient(67deg, #faae7b, #432371);
            align-items: center;
            justify-content: unset;
            flex-direction: column;
        }

        h1 {
            color: #ffffff;
            font-optical-sizing: auto;
            font-weight: 670;
            font-style: normal;
            font-size: 33.5vw;
            margin: 0;
        }

        h2 {
            color: #ffffff;
        }

        .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none; /* Safari */
            -khtml-user-select: none; /* Konqueror HTML */

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Akt:wght@670&display=swap');
        </style>
    </head>
    <body id="fourohfour" class="noselect">
        <h1 id="primary404">404</h1>
        <h2 id="bottext">yo this page aint real. the government has being LYING to you.</h2>

        <script>const primary404 = document.getElementById("primary404");
        const botText = document.getElementById("bottext");
        const bg = document.getElementById("fourohfour")

        let numberVal = 404;

        function incrementNum() {
            numberVal++;
            primary404.textContent = numberVal;
            
            if (numberVal == 420) {
                bg.style.background = "linear-gradient(67deg, #00B256, #7BA08D)"
            }
            if (numberVal == 421) {
                bg.style.background = "linear-gradient(67deg, #432371, #faae7b)"
            }

            if (numberVal >= 467) {
                botText.textContent = "there isn't anything further unlike the main page. if you want you can continue i guess"
            }
        }

        primary404.addEventListener("click", incrementNum);</script>
    </body>
